name: insta360-immich-bridge
services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      args:
        MEDIA_SDK_DEB: ${MEDIA_SDK_DEB:-vendor/MediaSDK-3.1.5-linux-amd64.deb}
    env_file: .env
    environment:
      BRIDGE_CONFIG: /config/bridge-config.json
      BRIDGE_PORT: 8008
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video,graphics
    runtime: nvidia
    init: true
    restart: unless-stopped
    volumes:
      - ${BRIDGE_CONFIG_DIR:-./bridge-config}:/config
      - ${BRIDGE_STATE_DIR:-./bridge-state}:/state
      - ${BRIDGE_WORK_DIR:-./bridge-work}:/work
      - ${SOURCE_DIR:-./sources}:/sources:ro
    expose: ["8008"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    environment:
      NGINX_PORT: 3000
      API_PROXY_TARGET: http://backend:8008
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on: [backend]
    restart: unless-stopped
